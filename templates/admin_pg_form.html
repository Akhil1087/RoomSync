{% extends 'base.html' %}{% block title %}Admin — PG Listing{% endblock %}{% block content %}<div class="container section"><div class="eyebrow">ADMIN</div><h2>{{ 'Edit' if pg.id else 'Add' }} PG / Flat</h2><form method="post" enctype="multipart/form-data" class="card-shell mt-4"><div class="row g-3"><div class="col-md-8"><label>Name</label><input name="name" class="form-control" value="{{pg.name or ''}}" required></div><div class="col-md-4"><label>City</label><input name="city" class="form-control" value="{{pg.city or ''}}" required></div><div class="col-12"><label>Description</label><textarea name="description" class="form-control">{{pg.description or ''}}</textarea></div><div class="col-md-6"><label>Address</label><input name="address_line" class="form-control" value="{{pg.address_line or ''}}" required></div><div class="col-md-3"><label>State</label><input name="state" class="form-control" value="{{pg.state or ''}}" required></div><div class="col-md-3"><label>Pincode</label><input name="pincode" class="form-control" value="{{pg.pincode or ''}}" required></div><div class="col-md-3"><label>Latitude</label><input name="latitude" type="number" step="any" class="form-control" value="{{pg.latitude or ''}}" required></div><div class="col-md-3"><label>Longitude</label><input name="longitude" type="number" step="any" class="form-control" value="{{pg.longitude or ''}}" required></div><div class="col-md-3"><label>Min rent</label><input name="rent_range_min" type="number" class="form-control" value="{{pg.rent_range_min or ''}}"></div><div class="col-md-3"><label>Max rent</label><input name="rent_range_max" type="number" class="form-control" value="{{pg.rent_range_max or ''}}"></div><div class="col-md-3"><label>Total rooms</label><input name="total_rooms" type="number" class="form-control" value="{{pg.total_rooms or ''}}"></div><div class="col-md-3"><label>Available rooms</label><input name="available_rooms" type="number" class="form-control" value="{{pg.available_rooms or ''}}"></div><div class="col-12"><label>Amenities (comma separated)</label><input name="amenities" class="form-control" value="{{pg.amenities or ''}}" placeholder="WiFi, Food, Parking"></div><div class="col-12"><label>Image URLs (one per line)</label><textarea name="image_urls" class="form-control" rows="3">{{pg.image_urls or ''}}</textarea></div><div class="col-12"><label>Or upload images</label><input type="file" name="images" class="form-control" multiple accept="image/*"></div><div class="col-12"><button class="btn btn-coral rounded-pill">Save listing</button></div></div></form></div>{% endblock %}
