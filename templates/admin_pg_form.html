{% extends 'base.html' %}{% block title %}Admin — Property Listing{% endblock %}{% block content %}<div class="container section"><div class="eyebrow">ADMIN</div><h2>{{ 'Edit' if pg.id else 'Add' }} property</h2><form method="post" enctype="multipart/form-data" class="card-shell mt-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3">
<div class="col-md-8"><label>Property name</label><input name="name" class="form-control" value="{{pg.name or ''}}" required></div><div class="col-md-4"><label>Property type</label><select name="property_type" class="form-select">{% for x in ['PG','Complete flat','Individual room'] %}<option {% if pg.property_type==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div>
<div class="col-12"><label>Description</label><textarea name="description" class="form-control">{{pg.description or ''}}</textarea></div><div class="col-md-6"><label>Address</label><input name="address_line" class="form-control" value="{{pg.address_line or ''}}" required></div><div class="col-md-3"><label>City</label><input name="city" class="form-control" value="{{pg.city or ''}}" required></div><div class="col-md-3"><label>State</label><input name="state" class="form-control" value="{{pg.state or ''}}" required></div><div class="col-md-3"><label>Pincode</label><input name="pincode" class="form-control" value="{{pg.pincode or ''}}" required></div>
<div class="col-md-3"><label>Campus</label><select name="campus" class="form-select">{% for x in campuses %}<option {% if pg.campus==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Nearby DU college / area</label><input name="college_area" class="form-control" value="{{pg.college_area or ''}}" placeholder="e.g. Hindu College, North Campus"></div><div class="col-md-3"><label>Gender preference</label><select name="gender_preference" class="form-select">{% for x in ['Any','Boys','Girls','Co-ed'] %}<option {% if pg.gender_preference==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div>
<div class="col-md-3"><label>Latitude</label><input name="latitude" type="number" step="any" class="form-control" value="{{pg.latitude or ''}}" required></div><div class="col-md-3"><label>Longitude</label><input name="longitude" type="number" step="any" class="form-control" value="{{pg.longitude or ''}}" required></div><div class="col-md-3"><label>Min rent</label><input name="rent_range_min" type="number" min="0" class="form-control" value="{{pg.rent_range_min or ''}}"></div><div class="col-md-3"><label>Max rent</label><input name="rent_range_max" type="number" min="0" class="form-control" value="{{pg.rent_range_max or ''}}"></div><div class="col-md-3"><label>Security deposit</label><input name="security_deposit" type="number" min="0" class="form-control" value="{{pg.security_deposit or ''}}"></div><div class="col-md-3"><label>Total rooms</label><input name="total_rooms" type="number" min="0" class="form-control" value="{{pg.total_rooms or ''}}"></div><div class="col-md-3"><label>Available rooms</label><input name="available_rooms" type="number" min="0" class="form-control" value="{{pg.available_rooms or ''}}"></div><div class="col-md-3"><label>Availability</label><select name="availability_status" class="form-select">{% for x in ['Available','Limited','Unavailable'] %}<option {% if (pg.availability_status or 'Available')==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label>Amenities (comma separated)</label><input name="amenities" class="form-control" value="{{pg.amenities or ''}}" placeholder="WiFi, Food, Parking"></div><div class="col-md-3 form-check mt-5"><input class="form-check-input" type="checkbox" name="food_available" value="yes" {% if pg.food_available %}checked{% endif %}><label class="form-check-label">Food available</label></div><div class="col-md-3 form-check mt-5"><input class="form-check-input" type="checkbox" name="is_featured" value="yes" {% if pg.is_featured %}checked{% endif %}><label class="form-check-label">Featured listing</label></div>
<div class="col-12"><label>Image URLs (one per line)</label><textarea name="image_urls" class="form-control" rows="3">{{pg.image_urls or ''}}</textarea></div><div class="col-12"><label>Or upload images</label><input type="file" name="images" class="form-control" multiple accept="image/png,image/jpeg,image/webp"></div><div class="col-12"><button class="btn btn-coral rounded-pill">Save listing</button></div></div></form></div>{% endblock %}
