{% extends 'base.html' %}{% block title %}Notifications{% endblock %}{% block content %}<div class="container section"><div class="eyebrow">YOUR UPDATES</div><h2>Notifications</h2><div class="card-shell mt-4">{% for n in items %}<a class="notification-row" href="{{ n.target_url or url_for('dashboard') }}"><div><strong>{{ n.title }}</strong><p class="muted mb-0">{{ n.body }}</p><small class="muted">{{ n.created_at.strftime('%d %b %Y, %I:%M %p') }}</small></div><span>→</span></a>{% else %}<div class="empty">You're all caught up.</div>{% endfor %}</div></div>{% endblock %}
