{% extends 'base.html' %}{% block title %}My Roommate Profile{% endblock %}{% block content %}
<div class="container section"><div class="page-head"><div><div class="eyebrow">YOUR PROFILE</div><h2>Tell us how you live</h2><p class="muted">Your college and lifestyle preferences help RoomSync find compatible roommates.</p></div></div>
<form method="post" class="card-shell"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-4">
<div class="col-md-6"><label>Full name</label><input class="form-control" value="{{ current_user.full_name }}" disabled></div><div class="col-md-6"><label>Phone</label><input name="phone" class="form-control" value="{{ current_user.phone or '' }}" maxlength="10" pattern="[0-9]{10}" title="Enter a 10-digit phone number"></div>
<div class="col-md-6"><label>DU college</label><select name="college" id="collegeSelect" class="form-select"><option value="">Select your college</option>{% for campus, names in colleges.items() %}<optgroup label="{{ campus }}">{% for name in names %}<option value="{{ name }}" data-campus="{{ campus }}" {% if profile.college==name %}selected{% endif %}>{{ name }}</option>{% endfor %}</optgroup>{% endfor %}</select></div>
<div class="col-md-6"><label>Campus</label><select name="campus" id="campusSelect" class="form-select"><option value="">Select campus</option>{% for campus in colleges %}<option value="{{ campus }}" {% if profile.campus==campus %}selected{% endif %}>{{ campus }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label>Monthly budget min (₹)</label><input type="number" min="0" name="budget_min" class="form-control" value="{{ profile.budget_min or '' }}" required></div><div class="col-md-6"><label>Monthly budget max (₹)</label><input type="number" min="0" name="budget_max" class="form-control" value="{{ profile.budget_max or '' }}" required></div>
<div class="col-md-6"><label>Sleep schedule</label><select name="sleep_schedule" class="form-select">{% for x,t in [('Early','Early sleeper'),('Regular','Regular'),('Late','Night owl')] %}<option value="{{ x }}" {% if profile.sleep_schedule==x %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Cleanliness (1–5)</label><input type="range" min="1" max="5" name="cleanliness_level" class="form-range" value="{{ profile.cleanliness_level or 3 }}" oninput="this.nextElementSibling.value=this.value"><output>{{ profile.cleanliness_level or 3 }}</output></div>
<div class="col-md-4"><label>Food habits</label><select name="food_habits" class="form-select">{% for x in ['Vegetarian','Non-vegetarian','Eggetarian','Vegan','No preference'] %}<option {% if profile.food_habits==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Social habits</label><select name="social_habits" class="form-select">{% for x in ['Quiet','Moderate','Social','Very social'] %}<option {% if profile.social_habits==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Study habits</label><select name="study_habits" class="form-select">{% for x in ['Quiet','Moderate','Group study','Flexible'] %}<option {% if profile.study_habits==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div>
<div class="col-md-4"><label>Smoking preference</label><select name="smoking_preference" class="form-select">{% for x in ['No preference','Non-smoker only','Okay with smoking'] %}<option {% if profile.smoking_preference==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Drinking preference</label><select name="drinking_preference" class="form-select">{% for x in ['No preference','Non-drinker only','Okay with drinking'] %}<option {% if profile.drinking_preference==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Room sharing</label><select name="sharing_preference" class="form-select">{% for x in ['Any','Single','Double','Triple','Shared room'] %}<option {% if profile.sharing_preference==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div>
<div class="col-md-8"><label>Preferred PG / Flat</label><select name="pg_flat_id" class="form-select"><option value="">Choose a property</option>{% for pg in pgs %}<option value="{{ pg.id }}" {% if profile.pg_flat_id==pg.id %}selected{% endif %}>{{ pg.name }} — ₹{{ pg.rent_range_min }}–₹{{ pg.rent_range_max }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Looking since</label><input type="date" name="looking_since" class="form-control" value="{{ profile.looking_since or '' }}"></div>
<div class="col-12"><label>Short bio</label><textarea name="bio" class="form-control" rows="4" maxlength="1000" placeholder="Tell a future roommate a little about yourself...">{{ profile.bio or '' }}</textarea></div><div class="col-12"><button class="btn btn-coral rounded-pill px-4">Save Profile</button></div></div></form></div>
<script>document.getElementById('collegeSelect')?.addEventListener('change',function(){const campus=this.selectedOptions[0]?.dataset.campus;if(campus)document.getElementById('campusSelect').value=campus;});</script>{% endblock %}
