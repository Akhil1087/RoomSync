{% extends 'base.html' %}{% block title %}My Roommate Profile{% endblock %}{% block content %}<div class="container section"><div class="page-head"><div><div class="eyebrow">YOUR PROFILE</div><h2>Tell us how you live</h2><p class="muted">These answers power your roommate compatibility score.</p></div></div><form method="post" class="card-shell">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-4"><div class="col-md-6"><label>Full name</label><input class="form-control" value="{{ current_user.full_name }}" disabled></div><div class="col-md-6"><label>Phone</label><input name="phone" class="form-control" value="{{ current_user.phone or '' }}"></div><div class="col-md-6"><label>Monthly budget min (₹)</label><input type="number" name="budget_min" class="form-control" value="{{ profile.budget_min or '' }}" required></div><div class="col-md-6"><label>Monthly budget max (₹)</label><input type="number" name="budget_max" class="form-control" value="{{ profile.budget_max or '' }}" required></div><div class="col-md-6"><label>Sleep schedule</label><select name="sleep_schedule" class="form-select"><option value="Early" {% if profile.sleep_schedule=='Early' %}selected{% endif %}>Early sleeper</option><option value="Regular" {% if profile.sleep_schedule=='Regular' %}selected{% endif %}>Regular</option><option value="Late" {% if profile.sleep_schedule=='Late' %}selected{% endif %}>Night owl</option></select></div><div class="col-md-6"><label>Cleanliness (1–5)</label><input type="range" min="1" max="5" name="cleanliness_level" class="form-range" value="{{ profile.cleanliness_level or 3 }}" oninput="this.nextElementSibling.value=this.value"><output>{{ profile.cleanliness_level or 3 }}</output></div><div class="col-md-4"><label>Food habits</label><select name="food_habits" class="form-select">{% for x in ['Vegetarian','Non-vegetarian','Eggetarian','Vegan','No preference'] %}<option {% if profile.food_habits==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Social habits</label><select name="social_habits" class="form-select">{% for x in ['Quiet','Moderate','Social','Very social'] %}<option {% if profile.social_habits==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Study habits</label><select name="study_habits" class="form-select">{% for x in ['Quiet','Moderate','Group study','Flexible'] %}<option {% if profile.study_habits==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div class="col-md-8"><label>Preferred PG / Flat</label><select name="pg_flat_id" class="form-select"><option value="">Choose a property</option>{% for pg in pgs %}<option value="{{ pg.id }}" {% if profile.pg_flat_id==pg.id %}selected{% endif %}>{{ pg.name }} — ₹{{ pg.rent_range_min }}–₹{{ pg.rent_range_max }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Looking since</label><input type="date" name="looking_since" class="form-control" value="{{ profile.looking_since or '' }}"></div><div class="col-12"><label>Short bio</label><textarea name="bio" class="form-control" rows="4" placeholder="Tell a future roommate a little about yourself...">{{ profile.bio or '' }}</textarea></div><div class="col-12"><button class="btn btn-coral rounded-pill px-4">Save Profile</button></div></div></form></div>{% endblock %}
